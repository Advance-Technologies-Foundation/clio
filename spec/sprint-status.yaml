    status_note: "Folded in, independent of every stage. Two defects in one call site: the tool takes GetLock(SharedFallbackKey) at three places (MobilePageConversionGuideTool.cs:111, :339, :531) after it has already resolved a real tenant — so it serializes unrelated tenants — and never calls the balancing MarkAvailable. GetLock PINS the lock-provider mapping in-use and is documented as 'balanced by MarkAvailable' (McpToolExecutionLock.cs:157-159), so unbalanced the mapping is pinned permanently. Fix by using the ExecuteUnderTenantLock helper, which balances by construction, instead of a hand-rolled lock."
