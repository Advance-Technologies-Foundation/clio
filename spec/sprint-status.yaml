  # --- process-element-connections (activity "Connected to") ---
  # Analysis complete; every research fact closed. 10 decisions taken (D1, D1a, D2, D3, D6, D7, D8, D9, D10, D11)
  # — see spec/adr/adr-process-element-connections.md. D8 was taken during story 4. Still open and NOT blocking
  # any shipped story: D4, D5, D12.
  # Key measured premise: the shipped `addMapping` already writes a connection end to end (plan §5.1), so this
  # feature is enforcement + ergonomics + read-back, not new capability. Per D1, stories 1-3 are ONE delivery.
  - id: story-process-element-connections-1
    title: "The connections knowledge layer — catalog, capability rule, deprecation predicate"
    feature: "process-element-connections"
    repo: "ProcessBuilder"
    size: M
    status: done
    jira: ENG-91845
    pr: engineering/crt-process-builder#21
    file: spec/stories/story-process-element-connections-1.md
    prd: spec/process-element-connections/process-element-connections-plan.md
    adr: spec/adr/adr-process-element-connections.md
    status_note: "EntityConnection* names, not ActivityConnection* (D2); host entity is an internal seam defaulting to Activity and the tag is DERIVED, never the literal (Activity has a column of that exact name). ConnectionCapability owns both the allow-list and the D3 effectiveness rule — manual-send email must evaluate EFFECTIVE (ManualEmailUserTaskSender has no gate). UserTaskDeprecationPolicy lives OUTSIDE ConnectionCapability and needs the metadata fallback (FindInstanceByUId ?? FindInstanceFromMetaData): without it the predicate silently returns Advanced for everything. Unit layer is writable (mock lookup columns carry non-empty UId/ReferenceSchemaUId) but Caption is EMPTY — no test may assert caption content."
    depends_on: []
    blocks:
      - story-process-element-connections-2
      - story-process-element-connections-3

  - id: story-process-element-connections-2
    title: "Read side — the hybrid connection reader and the describe projection"
    feature: "process-element-connections"
    repo: "ProcessBuilder"
    size: M
    status: done
    jira: ENG-91845
    pr: engineering/crt-process-builder#21
    file: spec/stories/story-process-element-connections-2.md
    prd: spec/process-element-connections/process-element-connections-plan.md
    adr: spec/adr/adr-process-element-connections.md
    status_note: "D11 hybrid: emit BOTH the raw persisted value and a decoded source in exactly the shape setConnections accepts. Cross-reference by uid works for the two [Parameter:…] dialects but is INAPPLICABLE to [#Lookup.{schemaUId}.{recordId}#] — neither GUID appears anywhere in the payload, and there is no displayValue to fall back on. Decoder never fails and never half-decodes; unknown macros degrade to expression. New pinned acceptance: describe -> setConnections -> describe round-trip PER DIALECT plus one unrecognised-macro case. Mirror FilterDescriptorReader."
    depends_on:
      - story-process-element-connections-1
    blocks:
      - story-process-element-connections-4

  - id: story-process-element-connections-3
    title: "Write side — setConnections / clearConnections, guards, three-state diagnosis"
    feature: "process-element-connections"
    repo: "ProcessBuilder"
    size: L
    status: done
    jira: ENG-91845
    pr: engineering/crt-process-builder#21
    file: spec/stories/story-process-element-connections-3.md
    prd: spec/process-element-connections/process-element-connections-plan.md
    adr: spec/adr/adr-process-element-connections.md
    status_note: "D1a: setConnections is an UPSERT keyed on `column` — columns absent from the request are left untouched; clearing is only ever explicit. Replace semantics were rejected because a caller sending only Account would silently clear Contact, and a cleared connection (Source = None) is filtered out of describe, so the damage would be invisible in the artefact meant to verify it. Changing an existing connection, including across dialects, is the same call with a new source (the platform's SourceValue setter replaces by FindByTargetUId, so no duplicate accumulates). Guards refuse rather than ignore, and none may reach describe. The `expression` escape hatch gets the type check it currently lacks (BuildSourceValue stores it verbatim). D6: no Activity column is created here — refuse with state (1) and name story 5."
    depends_on:
      - story-process-element-connections-1
    blocks:
      - story-process-element-connections-4

  - id: story-process-element-connections-4
    title: "clio surface — MCP contract, guidance, rebundle, E2E"
    feature: "process-element-connections"
    repo: "clio"
    size: M
    status: review
    jira: ENG-91845
    pr: 1027
    file: spec/stories/story-process-element-connections-4.md
    prd: spec/process-element-connections/process-element-connections-plan.md
    adr: spec/adr/adr-process-element-connections.md
    status_note: "Wire field is `connections`, never activityConnections and no host member (D2) — that is what keeps a future host entity ADDITIVE. D8 detector is MANDATORY, not defensive: measured on a live stand, a request carrying a future-shaped connections array is answered normally with the member SILENTLY IGNORED (no IExtensibleDataObject across all DataContract types (25 when measured, 27 after this feature)), and [RequiresPackage] is presence-only with a pin test asserting the ABSENCE of a version literal. Guidance is guidance/mcp/guides/processes/process-modeling.md (316 lines at the time of analysis, reachable via gh api not WebFetch); it said NOTHING about connections, and clio-knowledge#50 is the PR that fixes that — seven passages pinned to lines, incl. 289 where the article itself states you cannot guess the Lookup ids. E2E: the process-designer surface is 43 tests across 9 files; Describe has only 2 today and gains six round-trip cases."
    depends_on:
      - story-process-element-connections-2
      - story-process-element-connections-3
    blocks: []

  - id: story-process-element-connections-5
    title: "Making a section connectable — the registration recipe and the cache-reset artifact"
    feature: "process-element-connections"
    repo: "clio"
    size: M
    status: in-progress
    jira: ENG-91845
    file: spec/stories/story-process-element-connections-5.md
    prd: spec/process-element-connections/process-element-connections-plan.md
    adr: spec/adr/adr-process-element-connections.md
    status_note: "Deliberately independent of stories 1-4: D6 puts data-model mutation outside CrtProcessBuilder. Mostly COMPOSITION of capabilities clio already ships — update-entity-schema (adds the lookup column, publishes, rebuilds OData) + add-package-dependency (CrtCoreBase) + create-data-binding/add-data-binding-row (registry row, byte-equivalent to the 7.x wizard's artefact). Believed at analysis time to be the ONLY genuinely new code: cache invalidation (RE-SCOPED during story 5 — the runtime write channel never reads the registry, so this is ergonomics for the designer, not correctness; the shipped new code is the AC-02 cross-package pre-check) (ProcessUserTaskSchemaManager.reset): without it the designer shows the old list even after a compile, which is why the unofficial add-column-INSERT-compile recipe fails in practice. Needs a same-name pre-check — a colliding column breaks Activity for the WHOLE environment via a codegen ValidateException. One thing to verify once: that update-entity-schema cleanly ADDS a column to Activity (its docs cover inherited-column edits, which is a different operation). Carries its own AC-08 (the gap story 4 could not close; note story 4 has a DIFFERENT AC-08, the E2E-budget one): this is the first point at which the CREATED-parameter runtime tail can be verified at all, because ResolveColumn refuses a host column that is neither registered nor element-declared, so the created path needs a registered-but-undeclared column and this recipe is what produces one."
    depends_on: []
    blocks: []

  - id: story-process-element-connections-6
    title: "SysVariable connections — the write-time refusal, its rebundle and the E2E that can only follow it"
    feature: "process-element-connections"
    repo: "ProcessBuilder+clio"
    size: S
    status: in-progress
    jira: ENG-91845
    file: spec/stories/story-process-element-connections-6.md
    prd: spec/process-element-connections/process-element-connections-plan.md
    adr: spec/adr/adr-process-element-connections.md
    status_note: "Follow-up found by reviewing a real session, not by planning: setConnections accepted any [#...#] token, so a SUCCESSFUL write told the caller nothing and the caller hedged. The package now refuses a [#SysVariable...#] whose name does not resolve through SystemValueManager or whose value type is not Guid (crt-process-builder, EntityConnectionBinder.EnsureCompatibleSystemVariable) — checkable, unlike the [#SysSettings...#] residual, because the vocabulary is compiled into the platform and an unknown name breaks CODE GENERATION rather than merely writing nothing. Docs/guidance for the three usable variables shipped first and deliberately describe BOTH behaviours, since an older CrtProcessBuilder on the environment keeps the unchecked one. OPEN AND MANDATORY: clio.mcp.e2e coverage for the two refusals (unknown name, non-record type) CANNOT be written until the rebundle lands — the bundled package is resolved from the BUILD OUTPUT, so the E2E would exercise the old assembly and pass vacuously. Sequence is fixed: merge the package PR, rebundle from the merged sources (never from a working tree), re-pin ExpectedArchiveSha256 + ExpectedDescriptorModifiedOnUtc, THEN add the E2E. Also open, deliberately deferred pending measurement: the variable-to-entity check (a Contact variable on an Account column), which needs a table the platform exposes only client-side — until it exists AutoGuid/SequentialGuid pass the type check while generating a value rather than referencing a record."
    depends_on:
      - story-process-element-connections-3
    blocks: []

