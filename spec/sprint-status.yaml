      converging gateway rather than a phrasing change. Added: R15 self-loop, one default per source,
      the or-gateway plain-flow error (arity-scoped for the same reason - 14 shipped gateways carry a
      single plain flow), the empty-condition error, and the parallel-join deadlock warning
      ai-bp-connection-rules promised and nobody wrote. R7/R9's warning now names
      MismatchItemsCountException instead of saying the process "dead-ends".
