  # feature builds on does not exist on master).
  # Sliced from the ADR's 9-vertical-slice Implementation Plan. 17 stories:
  #   1 (c3 guard) | 2 (shared c1 deps) -> 3..9 (c1 tools, SERIALIZED — see below) | 10 (c2) |
  #   11-14 (matrix tools, parallel) -> 15 (consolidated E2E, owns ALL FR-08/AC-07/AC-09 e2e) ->
  #   16 (OQ-04 registry, maps (tool, dependency-path, scenario) -> named tests) -> 17 (docs).
  # SERIALIZED MERGE ORDER 3 -> 4 -> 5 -> 6 -> 7 -> 8 -> 9: all seven c1 tools live in
  # clio/Command/McpServer/Tools/ApplicationTool.cs (+ ApplicationToolArgs.cs) — no two open PRs may touch
  # the same file concurrently; encoded via depends_on chains below.
  # blocks fields are RECIPROCAL with depends_on (every direct dependent is listed).
  # FR-10 (CLIO* clean incl. CLIO005 + per-slice targeted test run) is carried by every code story 1-16.
  # ADR "CLI flag specification" table: [Required] removed from environment-name on the 7 Application
  # args records (stories 3-9), PageSyncArgs (story 12), and the two name-based LinkFromRepositoryTool
  # methods (story 1) — NOT on update-page/get-component-info/build-theme (already optional today).
  # clio.mcp.e2e is NOT in CI — story 15's suites run manually against a live stand.
