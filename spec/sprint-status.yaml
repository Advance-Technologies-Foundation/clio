  - id: story-mcp-worker-execution-boundary-17
    title: "Nobody reads the worker's standard error"
    feature: "mcp-worker-execution-boundary"
    repo: "clio"
    size: S
    status: review
    jira: ENG-95262
    file: spec/stories/story-mcp-worker-execution-boundary-17.md
    adr: spec/adr/adr-mcp-worker-execution-boundary.md
    status_note: "Stage 4a finding, but the stream belongs to the SUPERVISOR, not the relay: WorkerProcessSupervisor redirects it (WorkerProcessSupervisor.cs:339) and exposes it on the lease (IWorkerProcessSupervisor.cs:126), while IWorkerChildTransportOwner.ConnectAsync deliberately takes stdin/stdout only (WorkerChildTransportOwner.cs:51). Nothing in clio/ reads it. Two consequences: a worker that dies at startup produces only 'The worker closed its transport before answering' (WorkerMcpRelay.cs:480-482), the same sentence for every startup failure there is; and an undrained redirected pipe has a finite OS buffer, so a chatty worker BLOCKS on the write and goes silent — the documented .NET Process deadlock — which ADR 3.3's stage-event silence timer then reports as a lost child with the blame pointing at the environment. Redaction is not optional: TC-U-505 already requires that no secret marker survives 'worker-stderr passthrough', so that row presumes this drain exists. Drain continuously (capturing after exit is the deadlocking case), keep a bounded tail, and never route it to the parent's stdout, which IS the parent's MCP transport. Encoded one-sided (blocks story 6) so no existing row is reshaped."
    depends_on:
      - story-mcp-worker-execution-boundary-2
    blocks:
      - story-mcp-worker-execution-boundary-6
  - id: story-mcp-worker-execution-boundary-18
    title: "Concurrent sends to one child transport are unverified"
    feature: "mcp-worker-execution-boundary"
    repo: "clio"
    size: S
    status: review
    jira: ENG-95262
    file: spec/stories/story-mcp-worker-execution-boundary-18.md
    adr: spec/adr/adr-mcp-worker-execution-boundary.md
    status_note: "Stage 4a gap, and the only one of the five whose status is UNKNOWN rather than wrong. The relay writes to the child from the caller's thread (WorkerMcpRelay.cs:285-288), from the handshake (:428, :448-451) and from the off-loop request answerer (:556-559, :575-579, dispatched at :469 so a slow client cannot stall notification forwarding). The READ side is documented single-consumer and asserted; the WRITE side has no equivalent statement, and whether the SDK's StreamClientSessionTransport serialises writes was assumed, never checked. Interleaved writes corrupt newline-delimited framing, so the worker either fails to parse or drops a request — which reads as a sick environment, not as a client bug. Reachability, stated honestly: per-call traffic does not overlap by construction (one tools/call, then an await during which the only other write is a sampling answer), so the overlap becomes ordinary at Stage 7 — a second tools/call on a sticky worker while a sampling answer is being written — and story 14 adds a fifth writer. Verify first, then branch: pin the SDK's guarantee with an interleaving test, or add an async send gate (never a lock across an await) and pin the same test. Encoded one-sided (blocks story 7) so no existing row is reshaped."
    depends_on:
      - story-mcp-worker-execution-boundary-4
    blocks:
      - story-mcp-worker-execution-boundary-7

  - id: story-mcp-worker-execution-boundary-19
    title: "A cohort member serializes every tenant on the shared fallback lock"
    feature: "mcp-worker-execution-boundary"
    status: review
    file: spec/stories/story-mcp-worker-execution-boundary-19.md
    adr: spec/adr/adr-mcp-worker-execution-boundary.md
    status_note: "RESOLVED 2026-08-18. AC-01 fixed at GetRelatedPageAddonTool.cs:56. AC-02 proven red-before-green: reverting the fix turns the new tests red naming __mcp_shared_fallback__ where the tenant key was expected, and the assertion covers WHICH key three ways including MarkInUse, which is skipped entirely for a fallback key and is therefore independent evidence rather than restated wiring. AC-03 measured 36 real ExecuteWithCleanLog call sites (NOT 188 -- that was the file count under Tools/**, and the story body is corrected): 8 environment-less before, 0 after. AC-04 fixed CreateRelatedPageAddonTool plus 8 BusinessRuleTool sites, and excluded BuildThemeTool and CompileCreatioTool with stated reasons. THE FINDING WORTH CARRYING FORWARD: BaseTool.ResolveTenantLockKey returns SharedFallbackKey whenever the base has no IToolCommandResolver, so two business-rule tools already passed options to the correct overload and were STILL on the shared key. A correct-looking call site degrades silently. The complete detector is: environment-less overload OR per-tenant work in a BaseTool subclass that does not thread commandResolver to its base. Module=McpServer green at 3645 passed / 0 failed. MCP, docs and ClioRing compatibility all reviewed, no update required."
    depends_on: []
  - id: story-mcp-worker-execution-boundary-20
    title: "The end-to-end delta this branch owes an explanation"
    feature: "mcp-worker-execution-boundary"
    status: in-progress
    file: spec/stories/story-mcp-worker-execution-boundary-20.md
    adr: spec/adr/adr-mcp-worker-execution-boundary.md
    status_note: "ROOT CAUSE PROVEN 2026-08-18, and it is neither hypothesis this story offered. The isolated run was executed: the test PASSED and the settings file was INTACT -- but that settles nothing, because the mechanism is targeting, not tearing. CLIO_HOME overrides HOME/LOCALAPPDATA verbatim and TestConfiguration.Load injects the suite-owned CLIO_HOME into every spawned process, so the test's isolation was INERT and its six reg-web-app registrations landed in the SHARED catalog (observed directly by snapshotting it mid-run). Second proven fact: 'clio settings bootstrap is broken' does NOT imply file damage -- CanExecuteEnvTools is just 'the ActiveEnvironmentKey resolves', and two runs on byte-identical files differing in that one key reproduce the message exactly. So this story's earlier conclusion that the file was damaged is NOT supported by the message used to establish it. TeamCity 15893259 primary source buckets the 46: 24 unresolvable-active-key, 18 IOException naming the shared home in the exception text with stack frames inside TemporaryClioSettingsOverride, 4 downstream parse failures. Nine fixtures rewrite that one shared file with non-atomic WriteAllText taking none of clio's cross-process locks, and SettingsHealthToolE2ETests deliberately installs the unresolvable key there; a sharing violation during its restore leaves that breakage for the rest of the run, which is also the 10->98 skip explosion. The branch owns the cascade -- through inert test isolation, NOT through the interprocess gate, which was never involved. AC-05 complete, all five classified with evidence: CreateWorkspace is NOT a working-directory regression (it died in Arrange on the shared-home IOException and never reached the omitted-directory path; failed 12 of the last 40 runs, all on this branch, never on master); ApplicationGetInfo is environmental (sync-schemas returned success:false on a stand-side configuration build failure, and none of create-app/sync-schemas/get-app-info is in the cohort). AC-06 both addressed: the settings test is fixed by IsolatedClioHome plus a self-check that refuses to run outside its private home, and BrowserSessionCache was a GENUINE Windows product defect -- WriteOwnerOnlyTextToFileAtomic publishes via MoveFileEx, which a reader's FileShare.Read handle denies, while Unix rename(2) ignores readers, so it was structurally invisible to a green macOS suite; the real consumer is Playwright reading storageState while clio refreshes it. Fixed with a bounded retry for contention shapes only, three unit tests all confirmed red against pre-fix code. STILL OPEN: AC-01/02/04 (heartbeat allowlist and worker progress) and AC-03 (the e2e run itself). The retry's behaviour under real Windows contention is argued from MoveFileEx semantics and pinned by substituted-move tests, not yet observed on an agent. AC-03 ANSWERED 2026-08-19 by TeamCity 15895074, FINAL counts: 3 failed / 595 passed / 12 IGNORED (615 recorded, 5 muted) against this branch previous 46/470/98 and the master baseline 4/585/10 -- so the branch now fails FEWER tests than master. An earlier reading of this same run said 496 passed / 9 ignored; that was taken at 100 percent complete but before the build finished, and testOccurrences lags by tens of minutes, which the runbook warns about explicitly. Ninety-eight ignored became twelve, which is the indicator that settles it -- tests skip when their environment is unreachable, not when a feature regresses -- and all 24 bootstrap-is-broken failures are gone. The first launch died at Deploy with InstallBundlePackages failed and a run launched by someone else failed with byte-identical text, i.e. job-wide product breakage, so it was relaunched pinned to the baseline product build. THE GATE TEST STILL FAILS, AND THAT IS THE FINDING: now in its OWN private home, so the reader fighting the writer is its own loop exactly as arranged, and it exposed SettingsRepository.CommitSettingsFile publishing with File.Replace / File.Move and NO retry -- the identical Windows publish a reader FileShare.Read handle denies, in a second place. Both original readings held a piece: hypothesis 2 (flaky host) WRONG, hypothesis 1 (the gate does not hold for the settings catalogue) RIGHT and unprovable until the inert isolation was removed. Fixed with the already-measured policy; SettingsFileChangedException deliberately not caught because it is the optimistic-concurrency answer. Remaining three failures named and tracked separately: one auth failure against the stand, two page tools that are in no cohort."
    depends_on:
      - story-mcp-worker-execution-boundary-6

  - id: story-mcp-worker-execution-boundary-21
    title: "Truncating the worker's standard error can un-redact a secret"
    feature: "mcp-worker-execution-boundary"
    status: review
    file: spec/stories/story-mcp-worker-execution-boundary-21.md
    adr: spec/adr/adr-mcp-worker-execution-boundary.md
    status_note: "RESOLVED 2026-08-18. AC-01: a trimmed tail drops its leading PARTIAL line unconditionally, and when no complete line survives the tail is withheld behind an explicit notice rather than emptied -- an empty tail would fail CarriesStandardError and strip worker-stderr, its truncation marker AND the caveat together, telling the reader the worker said nothing when the truth is that clio withheld what it kept. Unconditional rather than only-when-the-cut-landed-mid-token, because the conditional form puts the redactor pattern list inside the drain and has to be kept in step with it forever. Applied at snapshot time, not in the pump, because Tail() runs on paths before StopAsync while the buffer may still be growing. AC-02 observed red-before: reverting only Tail() to the pre-fix expression fails 2 of 33 with the marker leaking verbatim into worker-stderr; the sibling fits-inside-the-bound test stays green in that run, which is what pins the drop to truncation. The fixture asserts its own precondition -- that the last StandardErrorTailLimit characters really do begin mid-key -- and sizes the payload FROM the dispatcher constant, so moving the bound moves the cut instead of quietly re-padding the orphan into filler, which is exactly how it went unnoticed. AC-03 asserts on the whole StructuredContent of a real RelayFailureResult envelope built through the real drain, no redactor called directly. AC-04 records the failure CLASS in the threat model: redaction can be defeated UPSTREAM of itself, because every pattern recognises a secret by context and any transformation between capture and redaction can remove that evidence; the rule is REDACT FIRST then transform, with the stated exception that where bounding is liveness the order cannot be inverted and the cut must at least be structural. RESIDUAL, recorded not fixed: CredentialPairRegex uses backslash-s which includes a newline, so a key ending the dropped line with its value beginning the surviving one is still orphaned -- and tightening the pattern would make the untruncated multi-line case WORSE, so this is the limit of context-based redaction rather than a bug. Full unit suite 9181 passed / 20 failed, names matching the macOS baseline exactly. MCP, docs and ClioRing all reviewed, no contract changed -- Ring does not consume the worker failure envelope. TWO ADJACENT R-7 EXPOSURES found by the mandated scope sweep and verified independently, both DIFFERENT classes from this story: CompileOperationRegistry.BuildMessageTail returns 50 log messages to an MCP caller with no redaction at all (missing redaction, not truncation), and ExecuteEsqTool returned an unredacted DataService error body from two paths while a third redacted the same body -- the ExecuteEsqTool asymmetry is FIXED here since execute-esq is a stage-6 cohort tool; the compile tail is tracked separately because a compile log is what the user needs to read and over-redacting it is its own harm."
    depends_on:
      - story-mcp-worker-execution-boundary-17

