    status_note: "Stage 10. Deletes the universal per-tenant monitor, McpReadResponseDeadline + McpReadDeadlineGate, CwdLock, session-container pinning and the CLIO_MCP_READ_DEADLINE_SECONDS contract — this work ends by removing machinery rather than adding a second layer. Deletion order is constrained: the .clio-pages gate (story 9) before CwdLock, the parent-owned reservation (story 7) before per-call children reach compile-creatio, and the monitor and deadline LAST since they are the only bound for any cohort still in-process. Both ordering constraints are encoded, not prose-only: depends_on lists story 7 and story 9, and both list story 10 in blocks. Full unit suite required — the deletions touch BindingsModule.cs (monitor, deadline, session pinning) and clio/Common/** (CwdLock), and span well over 3 modules. Also reverts the CLI-first exception in creatio-ai-app-development-toolkit#93, which names this work as its own reversal condition; that PR's two prohibitions stay regardless."
