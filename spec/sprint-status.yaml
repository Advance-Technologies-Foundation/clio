    status_note: "Stage 2. Containment, not EOF: Windows Job Object with kill-on-close, Unix process-group plus parent-death signalling, identity-checked stale cleanup (PIDs are reused). The prototype LEAKED one orphan when the parent was killed mid-operation, which is what the parent-SIGKILL E2E exists for. Carries the two open measurements that gate the stage: OQ-1 Windows spawn cost and Job Object containment, OQ-2 the concurrent-children ceiling as a number. Everything measured so far was macOS, so no cohort ships on Windows until OQ-1 closes. Touches the DI composition root — full unit suite required."
    depends_on:
      - story-mcp-worker-execution-boundary-1
    blocks: []
  - id: story-mcp-worker-execution-boundary-3
    title: "Worker mode: no host bootstrap, frozen tool generation"
    feature: "mcp-worker-execution-boundary"
    repo: "clio"
    size: M
    status: review
    jira: ENG-95262
    file: spec/stories/story-mcp-worker-execution-boundary-3.md
    adr: spec/adr/adr-mcp-worker-execution-boundary.md
    status_note: "Stage 3. Asymmetric deadline handling is deliberate: a STICKY worker keeps CLIO_MCP_RESPONSE_DEADLINE_SECONDS (stripping it turned a 25s backend call into a 77s block in the prototype, because the in-progress envelope is what returns the call), while an ORDINARY worker must not inherit a read-deadline override since the parent enforces by killing. The worker builds its client through the SAME ApplicationClientFactory path as the parent — a second construction site is exactly how a bearer principal silently became Supervisor once before, and the discriminating test is a fail-first identity assertion at the Creatio end, not 'the call succeeded'. Full unit suite required."
    depends_on:
      - story-mcp-worker-execution-boundary-2
    blocks: []
  - id: story-mcp-worker-execution-boundary-4
    title: "Transparent full-duplex relay"
    feature: "mcp-worker-execution-boundary"
    repo: "clio"
    size: XL
    status: review
    jira: ENG-95262
    file: spec/stories/story-mcp-worker-execution-boundary-4.md
    adr: spec/adr/adr-mcp-worker-execution-boundary.md
    status_note: "Stage 4. The relay MUST own the child's transport read loop: measured on SDK 1.4.1, forwarding through McpClientHandlers.NotificationHandlers reordered sequences 0..5 into [5,4,2,3,0,1], and a single-consumer FIFO in the parent did not fix it ([2,0,1,3,4] on retry). The two runs disagreeing shows the SDK dispatches notification callbacks CONCURRENTLY — a FIFO fed by racing producers preserves their disorder, so no buffering depth helps; owning the read loop works because it takes messages off the wire serially, before SDK dispatch. Full unit suite required — BindingsModule.cs is touched to register the relay filter on both dispatch seams. Sampling relay and _meta/progressToken fidelity both PASS unchanged. Highest silent risk is sampling: update-page and sync-pages call server.SampleAsync, and a non-full-duplex relay degrades semantic review to Skipped=true with no error at all. Composes with adr-mcp-durable-invocation (ENG-93370) on the shared WithCallToolHandler seam in one order only — durable name resolution first, then routing; routing first would key on an alias and miss. Extend that handler, do not register a competing one."
    depends_on:
      - story-mcp-worker-execution-boundary-3
    blocks: []
  - id: story-mcp-worker-execution-boundary-5
    title: "HTTP credential channel + per-client sticky isolation"
    feature: "mcp-worker-execution-boundary"
    repo: "clio"
    size: L
    status: deferred
    jira: ENG-95262
    file: spec/stories/story-mcp-worker-execution-boundary-5.md
    adr: spec/adr/adr-mcp-worker-execution-boundary.md
    status_note: "DEFERRED 2026-08-18 by the branch owner: mcp-http does not currently work and may be removed, so a credential channel for it is work for a transport that may not survive. The design already scoped Stage 6 stdio-only for exactly this reason (on stdio no secret crosses the channel - the child reads appsettings.json and gets only the environment name). Enforced consequence: the worker path must be STDIO-ONLY until this is revived, because a cohort tool routed over mcp-http would need the missing channel. Tracked as OQ-9. Original note follows. Stage 5. Secret material must never reach a child's command line — /proc/<pid>/cmdline and ps make it world-readable to any local user; the channel is an inherited handle or a pipe written after spawn (pipe preferred: env blocks are inherited by grandchildren and appear in crash dumps). Sticky scope key is principal + normalised target + credential fingerprint, all three: status tools are credential-scoped TODAY, so environment-only scoping would be both a cross-client boundary violation and a regression against shipped behaviour. Normalisation must be conservative — over-normalising merges two targets and carries one caller's credentials to another's; when in doubt spawn another worker, 0.7s against a credential crossover. Full unit suite required."
    depends_on:
      - story-mcp-worker-execution-boundary-3
    blocks: []
  - id: story-mcp-worker-execution-boundary-6
    title: "First cohort routed to workers"
    feature: "mcp-worker-execution-boundary"
    repo: "clio"
    size: M
    status: review
    jira: ENG-95262
    file: spec/stories/story-mcp-worker-execution-boundary-6.md
    adr: spec/adr/adr-mcp-worker-execution-boundary.md
    status_note: "Stage 6. The cohort is exactly the commands agents were forced off in creatio-ai-app-development-toolkit#93. Acceptance is the wedge scenario asserted ON BACKEND REQUEST COUNTERS, not timings: the wedged system also finishes at 12s, so only the counter delta distinguishes 'answered' from 'never asked'. Call D (backend healthy again) succeeding with at least one request is the acceptance criterion for the whole feature. NO FEATURE TOGGLE (decided 2026-08-17): the branch is the test environment, so a toggle defaulting to off would mean the branch verifies the OLD path. Cohort membership is the tool Location metadata from story 1 - data, not a switch - and the in-process arm of the A/B comparison is a DI substitution of the metadata reader. The merge-time default for master is OQ-5, decided at merge proposal. The e2e suite is NOT run by GitHub CI — trigger Team_Atf_ClioMcpE2eTests on TeamCity and state the result in the PR. AC-06 carries the .clio-pages ordering constraint: get-page is a .clio-pages reader-writer and a child escapes CwdLock by being another process, so story 9's file gate must exist before this cohort routes get-page, or get-page leaves the cohort. AC-07 added: the stdio-only constraint is now a testable acceptance criterion (TC-U-601) rather than design prose. Since story 5 was deferred it is a CORRECTNESS requirement, not a scope boundary -- a cohort tool over mcp-http would need the credential channel that does not exist. The coverage ALREADY EXISTS (McpExecutionRouterTests.Resolve_ShouldRefuseToRelay_WhenHostTransportIsNotStdio); the criterion names it rather than commissioning work. Unit tier deliberately: mcp-http does not currently run, so an end-to-end test there would only skip."
    depends_on:
      - story-mcp-worker-execution-boundary-4
    blocks: []
  - id: story-mcp-worker-execution-boundary-7
    title: "Sticky supervision + parent-owned configuration-build reservation"
    feature: "mcp-worker-execution-boundary"
    repo: "clio"
    size: L
    status: review
    jira: ENG-95262
    file: spec/stories/story-mcp-worker-execution-boundary-7.md
    adr: spec/adr/adr-mcp-worker-execution-boundary.md
    status_note: "BLOCKER identified 2026-08-18, in neither the ADR nor the kill-safety inventory: ADMISSION SLOTS DEADLOCK STICKY SUPERVISION, and it defeats AC-01 as written. SpawnContainedAsync takes a slot from a pool capped at ProcessorCount BEFORE launching and returns it only on lease dispose; a sticky worker holds its slot for the whole operation. AC-01 requires compile-status to reach that same worker, and today the only path to a worker begins by acquiring a slot -- so the poll waits for a slot held by the worker it is trying to reach. Hold-and-wait, not starvation: the state is stable until the operation ends unobserved, bounded only by the reservation 30-minute reclaim ceiling. On a single-core host the cap is 1, so ONE sticky worker makes every later call unreachable including its own poll. Why it was missed: the supervisor remarks already call the cap a shared HELD resource and already sketch a second pool, but frame it as FAIRNESS -- neither says the sticky worker own status poll is one of the callers it blocks. RESOLUTION, three parts, first one removes the cycle: (1) admission governs CREATING a worker, never TALKING to one that already exists -- a call resolving to a live lease reuses it and takes no slot, which the prototype 0.00-0.02s poll latency already implies; (2) sticky workers get their own pool with its own cap, which WorkerSlotPool already anticipates so the release path does not change; (3) the sticky cap must be STRICTLY LESS than the total so per-call work keeps a guaranteed floor -- two pools merely summing to ProcessorCount relabel the exhaustion. AC-01 must be amended to say the poll acquires no admission slot, and a new AC is needed: with the sticky pool saturated an ordinary per-call cohort read still completes. TESTING NOTE: the discriminating case is a poll issued while the sticky pool is SATURATED; a poll on an idle host passes under both the correct and the deadlocking implementation. Recorded in ADR section 3.2c and in the story. AC SET AMENDED 2026-08-18 by the blocker above: AC-01 now requires the poll to reach the same worker WITHOUT acquiring an admission slot, asserted with the sticky pool SATURATED (a poll on an idle host passes under both the correct and the deadlocking implementation, so the original wording could be satisfied by a deadlock). Added AC-06, the per-call floor: with the sticky pool saturated an ordinary per-call cohort read still completes -- nothing asserts this today. Added AC-07, closing threat-model gap G-1: the concurrency cap becomes operator-configurable following the CLIO_MCP_WORKER_QUEUE_WAIT_SECONDS precedent, which T-9 says is needed precisely at Stage 7 because sticky workers make a slot held for a whole lifetime the ordinary case. IN PROGRESS 2026-08-18: two foundations building in parallel on disjoint files -- AC-00 session-key normalisation against the binding T-5 component table (both directions, near-miss pairs must NOT fold, since over-normalising is a credential crossover on a sticky worker rather than a cache miss), and the admission-capacity model (reach-an-existing-worker seam, second pool, sticky cap strictly less than total, plus G-1). Sticky supervision, the private completion signal and the parent-owned configuration-build reservation are the NEXT phase and depend on both. AC-00 DELIVERED 2026-08-18: ISessionTargetNormalizer composed at ToolCommandResolver.BuildTargetIdentity (so R-5 principal + credential fingerprint are added at that CALL SITE when mcp-http returns, leaving the normaliser untouched); BuildCacheKey is now an instance method with NO static overload left behind, because a static that skips normalisation is green in a test and divergent in production. Red-before proven on the real path against unmodified production code, with the credential hash byte-identical on both sides so the failure is provably the split identity. 59 cases labelled by T-5 row, every row in both directions, IDNA/IPv6/combined pinned to explicit strings so a per-OS formatting difference fails instead of agreeing with itself. TWO PLATFORM TRAPS FOUND BY PROBING: new Uri(http://0177.0.0.1/).Host returns 127.0.0.1, i.e. System.Uri performs the exact octal fold T-5 REJECTS (IPAddress.Parse too), hence a manual authority split; and IdnMapping with UseStd3AsciiRules THROWS on underscore hosts, which are ordinary on dev stands, so IDNA runs only for non-ASCII. CONSEQUENCE HANDLED: RestartTool argued in two places that credentials-started and name-started restarts were STRUCTURALLY disjoint because BuildCacheKey used Environment ?? Uri -- convergence removes that guarantee, so both comments were corrected; behaviour deliberately unchanged and now conservative rather than structural, RestartToolTests 15/15 green. Module=McpServer 3735/0; Module!=Common 8256/0 as the discriminator that none of the 20 baseline failures is ours. ADMISSION CAPACITY DELIVERED 2026-08-18 (blocker parts 1-3 plus G-1). Part 1: IWorkerChannel split out of IWorkerLease and reached only via IWorkerReach, whose single member returns a non-owning channel implementing neither IWorkerLease nor IDisposable -- the guarantee is the DEPENDENCY, not the documentation, so routing a poll through admission becomes code that does not compile rather than a mistake someone might make. Parts 2-3 CORRECTED DURING REVIEW from a partition to a CEILING: the first implementation carved total into two pools and cost four-core hosts half their per-call throughput on the day it shipped with ZERO sticky workers in existence, and two-core build agents all but one slot, serialising the very e2e suite this branch needs green. Shipped model is one pool plus a ceiling of total/2 on sticky occupancy -- per-call uses every slot while no sticky worker exists, and the floor appears the moment one does. Counter reserved before the slot and released with it on every failure path, because a counter that drifts either leaks capacity or refuses forever and neither shows up in a green suite. G-1 CLOSED: CLIO_MCP_WORKER_CONCURRENCY sets the TOTAL only, sticky stays derived because two knobs would let an operator set sticky >= total and reintroduce the exhaustion the ceiling removes. Six mutations each caught by exactly the intended test, including the hold-and-wait cycle reproduced verbatim as a 2.002 s queue wait for a slot held by the worker being reached; reverting the ceiling to a partition turns four tests red. Module!=Common 8262/0 as the discriminator. STATED LIMITATION: on a single-slot host sticky capacity is 0 and long operations get a named refusal naming the knob -- a max(1, total/2) fallback was considered and rejected because it would leave per-call a floor of zero and break AC-06 exactly where it matters. STILL TO WIRE in the next phase: Lifetime=Sticky on the long-operation spawn, IWorkerReach injected into the poll path (never the full supervisor), and IWorkerReach registered as a forwarder to the SAME singleton -- a second instance makes every ReachExisting throw and gives each its own cap. REMAINING: AC-01 to AC-05 (sticky supervision, private completion signal, parent-owned configuration-build reservation, OQ-4). COMPLETE 2026-08-19. AC-01 to AC-05 delivered on the AC-00 and admission foundations. TWO TOOLS DELIBERATELY NOT SHIPPED: install-process-builder and create-app-section are supported by the machinery -- the private completion signal exists precisely because neither has a registry -- but a sticky worker is still killed at its lifetime bound and the kill-safety audit lists both under a kill leaves durable damage nothing repairs. ADR 2.5 reserves cohort expansion for Stage 10 tool by tool, so both the shipped and the withheld sets are pinned and moving a name between them is a reviewed line. The completion LINGER is a design decision the story did not ask for and reaping on the signal alone would have been wrong: on stdio the compile/restart registries are DI singletons INSIDE the worker, so an immediately reaped worker takes the operation record with it and a shipped e2e would have gone red. OQ-4 resolved: create-app-section gets the signal and NO registry, because a registry with no status tool is unobservable state."
    depends_on:
      - story-mcp-worker-execution-boundary-6
    blocks:
      - story-mcp-worker-execution-boundary-10
  - id: story-mcp-worker-execution-boundary-8
    title: "Long synchronous / streaming commands (deploy, uninstall)"
    feature: "mcp-worker-execution-boundary"
    repo: "clio+clio-ring"
    size: L
    status: review
    jira: ENG-95262
    file: spec/stories/story-mcp-worker-execution-boundary-8.md
    adr: spec/adr/adr-mcp-worker-execution-boundary.md
    status_note: "DELIVERED 2026-08-18. ADR section 3.3 terminal-stage protocol implemented: TerminalStageWatch observes the read loop, terminal detection is eventType == run-completed at the run ROOT runId, a 300 s stage-event silence bound restarted by every stage event (CLIO_MCP_WORKER_STAGE_SILENCE_SECONDS), a 30 s post-terminal exit grace via lease.HasExited + KillContained, synthetic-token injection with relay-side SUPPRESSION (the one deliberate exception to rule 1, decided in ADR 3.3), and an indeterminate result carrying IsError plus success:false plus an ADDITIVE outcome:indeterminate with no-retry guidance. BudgetExpiredErrorClass deliberately NOT reused -- its shipped guidance says the call is safe to retry, the worst possible instruction for a possibly half-installed environment. WaitWithinBudgetAsync deliberately not used. Bounds are Stopwatch-based so an NTP step cannot move them. Cohort membership added LAST, and the two pin tests were updated ON PURPOSE with story 8 as their new source -- those pins had been mutation-verified the same day as genuinely pinning literal names, so their going red was the mechanism working rather than a break. COUNTERS: there is no Creatio backend delta to assert here, because both tools are local-only with no IApplicationClient and deploy CREATES the instance; the test-plan rule is satisfied instead by spawn == 1, the only assertion that can observe an automatic retry, plus kill == 1, the kill ordinal AFTER the warning naming the last stage, and the child emit log stopping at the kill. State this in the PR or a reviewer applying the rule mechanically will ask for a backend delta that cannot exist. VERIFIED HERE: 12 unit tests over a scripted stage-streaming child on a real pipe with the production dispatcher/relay/transport, four mutations each caught by exactly the intended test; full unit suite 9194 passed / 20 failed with the 20 matching the macOS baseline BY NAME; ClioRing 155 passed / 1 failed, that one the known macOS path-separator artifact. HANDED BACK: AC-01/05/06 are E2E needing a Windows host with a disposable sandbox -- written, Explicit, opt-in, TeamCity-guarded and fail-closed, but unverified here; the TC-E-803 hang half is covered deterministically by the unit fixture because producing it against a real child would need a fault-injection hook deliberately not added to a shipping binary. AC-03 not re-run, and that is a CONCLUSION not an omission: ClioStageEvent.cs, ClioStageEventContract.cs (SchemaVersion still 1) and the Ring mirror are all unmodified, so no source-generated serialization path changed. TWO REVIEWER NOTES: the protocol is reachable ONLY through clio-run, because the write-capability gate stops a raw-name deploy-creatio before routing, and the synthetic token survives that vector since ClioRunTool copies Meta to the child params -- there is now a router test pinning the executor-unwrapped route, without which the live vector could silently fall back to the 120 s branch with every other test green; and a worker own tool result is never second-guessed against the stage stream, so the indeterminate path is only for no-result-obtained. ADR 3.3 CLARIFIED so code and ADR do not silently disagree: cancellation resolves as indeterminate in CLASSIFICATION at the wire, but a cancelled caller is no longer awaiting a response, so Stage 8 kills, emits a warning naming the last stage, and rethrows OperationCanceledException per the dispatcher documented caller-token contract."
    depends_on:
      - story-mcp-worker-execution-boundary-7
    blocks: []
  - id: story-mcp-worker-execution-boundary-9
    title: "Interprocess file gates"
    feature: "mcp-worker-execution-boundary"
    repo: "clio"
    size: M
    status: review
    jira: ENG-95262
    file: spec/stories/story-mcp-worker-execution-boundary-9.md
    adr: spec/adr/adr-mcp-worker-execution-boundary.md
    status_note: "Stage 9. Separate address spaces isolate memory, not the filesystem. .clio-pages/{schema}/meta.json is read-modify-write WITH SWALLOWED I/O failures, so an interleaved write is lost with no error — and CwdLock is today the only thing accidentally serialising it. Hard ordering constraint, and the trigger is a tool going CROSS-PROCESS, not the stage-10 deletion: a child escapes CwdLock simply by being another process, so the gate must exist before any .clio-pages writer joins the worker cohort (get-page, stage 6). Encoded as story 6 AC-06 rather than an inverted depends_on edge, which would make the graph cyclic. Stage 10's CwdLock removal is a second, later checkpoint on the same gate. DbHub needs nothing, already cross-process safe via .clio.lock and FileShare.None."
    depends_on:
