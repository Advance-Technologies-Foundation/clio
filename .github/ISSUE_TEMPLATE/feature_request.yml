# Component options must match "option" values in .github/component-owners.json exactly;
# .github/scripts/issue-routing/issue-routing.test.js enforces it.
name: Feature request
description: Propose new functionality or an improvement.
labels: ["functionality"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: >-
        Which part of clio is affected? This routes the issue to its owner
        (see .github/component-owners.json). Pick "Other / not sure" if unsure.
      options:
        - "Freedom UI pages (create/update/get/sync/validate-page, page templates, client unit schemas, component registry)"
        - "Freedom UI page custom logic (handlers, converters, validators, helper modules, code kept by a Designer save)"
        - "Mobile page conversion (web to mobile Freedom UI pages, get-mobile-page-conversion-guide)"
        - "Business rules (page and entity business rules)"
        - "Applications and sections (create-app, app sections, install-application)"
        - "Entity, lookup, source code and SQL schema definitions (entity schema, create-lookup, sync-schemas)"
        - "Data access and system settings (ESQ, run SQL scripts, data bindings, DataForge)"
        - "OData tools (odata-read, odata-create, odata-update, odata-delete)"
        - "Business processes and user tasks (process model, user tasks, CrtProcessBuilder)"
        - "Themes and branding (themes, palette, logo, background image)"
        - "Packages and compilation (push-pkg, compress, lock/unlock, dependencies, compile)"
        - "Workspaces (create/push/restore-workspace, workspace templates)"
        - "Creatio installation and local environments (deploy-creatio, start/stop, restart, restore-db)"
        - "Users, roles, licenses, record rights, OAuth and Identity Service"
        - "MCP server core (clio-run, tool contracts, discovery, MCP telemetry consent)"
        - "MCP guidance and knowledge (get-guidance, knowledge sources)"
        - "cliogate package"
        - "ClioRing desktop companion"
        - "CLI core (clio environment settings, authentication, command parsing)"
        - "Documentation and command help"
        - "Other / not sure"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
