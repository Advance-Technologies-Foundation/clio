# Component options must match "option" values in .github/component-owners.json exactly;
# .github/scripts/issue-routing/issue-routing.test.js enforces it.
name: Bug report
description: Something in clio does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please search existing issues first.
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: >-
        Which part of clio is affected? This routes the issue to its owner
        (see .github/component-owners.json). Pick "Other / not sure" if unsure.
      options:
        - "Freedom UI pages (create/update/get/sync/validate-page, page templates, client unit schemas, component registry)"
        - "Freedom UI page custom logic (handlers, converters, validators, helper modules, code kept by a Designer save)"
        - "Mobile page conversion (web to mobile Freedom UI pages, get-mobile-page-conversion-guide)"
        - "Business rules (page and entity business rules)"
        - "Applications and sections (create-app, app sections, install-application)"
        - "Entities and lookups (create and edit objects, columns and their properties, lookups, sync-schemas)"
        - "Source code and SQL schemas (C# source code schemas, SQL schemas)"
        - "ESQ and SQL (ESQ queries, run SQL scripts, DataForge)"
        - "Data bindings (package data bindings, seed data)"
        - "System settings (create, read and set system settings)"
        - "OData tools (odata-read, odata-create, odata-update, odata-delete)"
        - "Business processes and user tasks (process model, user tasks, CrtProcessBuilder)"
        - "Themes and branding (themes, palette, logo, background image)"
        - "Dashboards (dashboards and the dashboards migrator)"
        - "Packages and compilation (push-pkg, compress, lock/unlock, dependencies, compile)"
        - "Workspaces (create/push/restore-workspace, workspace templates)"
        - "Creatio installation and local environments (deploy-creatio, start/stop, restart, restore-db)"
        - "Users, roles, licenses, record rights, OAuth and Identity Service"
        - "MCP server core (clio-run, tool contracts, discovery, MCP telemetry consent)"
        - "MCP guidance and knowledge (get-guidance, knowledge sources)"
        - "cliogate package"
        - "ClioRing desktop companion"
        - "CLI core (clio environment settings, authentication, command parsing)"
        - "Documentation and command help"
        - "Other / not sure"
    validations:
      required: true
  - type: input
    id: clio-version
    attributes:
      label: clio version
      description: Output of `clio ver` (or the MCP server version).
      placeholder: "8.0.2.50"
    validations:
      required: true
  - type: input
    id: creatio-version
    attributes:
      label: Creatio version and runtime
      description: For example 8.2.1, .NET 8 / .NET Framework. Leave empty if not environment-related.
  - type: dropdown
    id: surface
    attributes:
      label: How was clio used?
      options:
        - CLI
        - MCP server (AI agent)
        - Both
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact command or MCP tool call, with arguments.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the error output. Remove passwords, tokens and connection strings.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
