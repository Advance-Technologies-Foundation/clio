---
# ENG-92669 - surface the TeamCity unit-tests result on clio PRs.
#
# Same mechanism as .github/workflows/teamcity-mcp-e2e.yml, whose header explains
# it in full (why an in-network self-hosted runner, why the sequential retry chain,
# why the preflight never sends the token): a job inside the corporate network
# queues Team_Atf_ClioUnitTests with BranchNameClio = the PR head branch, and the
# config's Commit Status Publisher (GitHub App "TeamCity ATF") posts the result
# onto the PR head SHA as the `CLIO Unit Tests (ATF)` commit status.
#
# Team_Atf_ClioUnitTests mirrors every test lane of build.yml in one build on one
# TeamCity agent: clio.tests (unit and integration categories, ~13.6k tests, ~5 min),
# then Clio.Analyzers.Tests, Creatio.ConflictResolver.Tests (net8.0),
# cliogate.tests (net472) and the net8.0 compatibility build of clio, each as a
# step that runs even when an earlier step failed. It is advisory: build.yml stays
# the required check, and this status is the TeamCity-side comparison run that the
# ENG-92669 fast-follow asked for. TeamCity keeps the per-test failure history
# (first failed build, mutes), which build.yml does not.
#
# The dedicated VCS root of Team_Atf_ClioUnitTests checks out
# refs/heads/%BranchNameClio% (default master); its VCS trigger still builds master
# on every push, so the TeamCity test history keeps a trunk baseline.
name: TeamCity unit tests

# GITHUB_TOKEN is unused here; drop all scopes so an in-network runner never
# carries ambient repo write via org defaults.
permissions: {}

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]
    # Every project one of the TeamCity steps builds or tests. Docs-only PRs are
    # skipped.
    paths:
      - 'clio/**'
      - '!clio/docs/**'
      - '!clio/help/**'
      - '!clio/Commands.md'
      - 'clio.tests/**'
      - 'clio.mcp.e2e/**'
      - 'clio.process.fixture/**'
      - 'Clio.Analyzers/**'
      - 'Clio.Analyzers.Tests/**'
      - 'Creatio.ConflictResolver/**'
      - 'Creatio.ConflictResolver.Tests/**'
      - 'cliogate/**'
      - 'cliogate.tests/**'
      - 'Directory.Packages.props'
      # The trigger tests itself: a change to this workflow or to the shared queue
      # script runs here for the price of one ~5-min TeamCity build. The e2e
      # workflow deliberately does not do this (its build is ~45 min).
      - '.github/workflows/teamcity-unit-tests.yml'
      - '.github/scripts/queue-teamcity-build.ps1'
  # Manual retrigger for a specific clio branch (e.g. re-run after a flaky
  # failure, or validate the trigger). Only usable once the workflow is on the
  # default branch - a GitHub constraint.
  workflow_dispatch:
    inputs:
      branch:
        description: 'clio branch to run the TeamCity unit tests on'
        required: true
        default: master

# De-dupes rapid GitHub trigger runs per PR (the sub-second POST job only).
# NOTE: this does NOT stop the ~5-min TeamCity build a prior run already queued
# - the least-privilege token cannot cancel builds. Manual runs key off run_id so
# they don't cancel each other.
concurrency:
  group: teamcity-unit-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  attempt-1:
    name: Queue TeamCity unit tests (attempt 1)
    runs-on: self-hosted
    # Never pin a shared self-hosted runner if TeamCity is unreachable/stalled.
    timeout-minutes: 10
    # SECURITY: this job runs on an in-network self-hosted runner. On a public
    # repo, a fork PR still fires `pull_request` and would run the fork-controlled
    # workflow body on that runner (a network-pivot surface) - so restrict to
    # same-repo PRs and manual dispatch. This in-file guard is defense-in-depth;
    # the authoritative control is the repo setting Actions -> "Require approval
    # for all external contributors" (must be enabled).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      # Only the workflow's own scripts are needed; checkout must not leave a token
      # behind on an in-network runner.
      contents: read
    outputs:
      queued: ${{ steps.queue.outputs.queued }}
      runner: ${{ steps.queue.outputs.runner }}
    steps:
      # Only .github/scripts, and no credential left in the local git config: the
      # trigger script is shared by every attempt and lives in the repository so
      # there is exactly one copy of it.
      # `path:` is NOT cosmetic. A self-hosted runner reuses one working directory per
      # repository across every workflow, and a sparse checkout there left the tree
      # without clio.tests for the next full checkout, which broke build.yml's unrelated Unit
      # Tests job on that runner (run 31490134021). Checking out into a directory of
      # our own keeps this workflow out of the tree the build workflows compile from.
      - name: Check out the trigger script
        uses: actions/checkout@v4
        with:
          path: .teamcity-trigger
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
      - name: Queue TeamCity build for the PR branch
        id: queue
        shell: powershell
        env:
          TC_URL: https://teamcity-rnd.bpmonline.com
          TC_TOKEN: ${{ secrets.TEAMCITY_TOKEN }}
          BUILD_TYPE: Team_Atf_ClioUnitTests
          BUILD_LABEL: unit tests
          # pull_request -> PR head branch; workflow_dispatch -> the chosen branch.
          HEAD_REF: ${{ github.event.pull_request.head.ref || inputs.branch }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '(manual)' }}
          RUNNER_LABEL: ${{ runner.name }}
        run: |
          $ErrorActionPreference = 'Stop'
          . "$env:GITHUB_WORKSPACE\.teamcity-trigger\.github\scripts\queue-teamcity-build.ps1"

  attempt-2:
    name: Queue TeamCity unit tests (attempt 2)
    needs: attempt-1
    # Runs only when attempt 1 found no route to TeamCity. `needs` also means this
    # job is scheduled after attempt 1 released its runner, so it can land on a
    # different one.
    if: needs.attempt-1.outputs.queued != 'true'
    runs-on: self-hosted
    timeout-minutes: 10
    permissions:
      # Only the workflow's own scripts are needed; checkout must not leave a token
      # behind on an in-network runner.
      contents: read
    outputs:
      queued: ${{ steps.queue.outputs.queued }}
      runner: ${{ steps.queue.outputs.runner }}
    steps:
      # Only .github/scripts, and no credential left in the local git config: the
      # trigger script is shared by every attempt and lives in the repository so
      # there is exactly one copy of it.
      # `path:` is NOT cosmetic. A self-hosted runner reuses one working directory per
      # repository across every workflow, and a sparse checkout there left the tree
      # without clio.tests for the next full checkout, which broke build.yml's unrelated Unit
      # Tests job on that runner (run 31490134021). Checking out into a directory of
      # our own keeps this workflow out of the tree the build workflows compile from.
      - name: Check out the trigger script
        uses: actions/checkout@v4
        with:
          path: .teamcity-trigger
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
      - name: Queue TeamCity build for the PR branch
        id: queue
        shell: powershell
        env:
          TC_URL: https://teamcity-rnd.bpmonline.com
          TC_TOKEN: ${{ secrets.TEAMCITY_TOKEN }}
          BUILD_TYPE: Team_Atf_ClioUnitTests
          BUILD_LABEL: unit tests
          HEAD_REF: ${{ github.event.pull_request.head.ref || inputs.branch }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '(manual)' }}
          RUNNER_LABEL: ${{ runner.name }}
        run: |
          $ErrorActionPreference = 'Stop'
          . "$env:GITHUB_WORKSPACE\.teamcity-trigger\.github\scripts\queue-teamcity-build.ps1"

  attempt-3:
    name: Queue TeamCity unit tests (attempt 3)
    needs: [attempt-1, attempt-2]
    # Third and last try. Two runners without a route in a row is unlikely but the
    # pool is not fixed, and one more sub-second job is far cheaper than a red check
    # that has nothing to do with the pull request. No always(): when an attempt
    # fails for a REAL reason (bad token, rejected request) the chain must stop and
    # surface it instead of retrying it twice more.
    if: >-
      needs.attempt-1.outputs.queued != 'true' &&
      needs.attempt-2.outputs.queued != 'true'
    runs-on: self-hosted
    timeout-minutes: 10
    permissions:
      # Only the workflow's own scripts are needed; checkout must not leave a token
      # behind on an in-network runner.
      contents: read
    outputs:
      queued: ${{ steps.queue.outputs.queued }}
      runner: ${{ steps.queue.outputs.runner }}
    steps:
      # Only .github/scripts, and no credential left in the local git config: the
      # trigger script is shared by every attempt and lives in the repository so
      # there is exactly one copy of it.
      # `path:` is NOT cosmetic. A self-hosted runner reuses one working directory per
      # repository across every workflow, and a sparse checkout there left the tree
      # without clio.tests for the next full checkout, which broke build.yml's unrelated Unit
      # Tests job on that runner (run 31490134021). Checking out into a directory of
      # our own keeps this workflow out of the tree the build workflows compile from.
      - name: Check out the trigger script
        uses: actions/checkout@v4
        with:
          path: .teamcity-trigger
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
      - name: Queue TeamCity build for the PR branch
        id: queue
        shell: powershell
        env:
          TC_URL: https://teamcity-rnd.bpmonline.com
          TC_TOKEN: ${{ secrets.TEAMCITY_TOKEN }}
          BUILD_TYPE: Team_Atf_ClioUnitTests
          BUILD_LABEL: unit tests
          HEAD_REF: ${{ github.event.pull_request.head.ref || inputs.branch }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '(manual)' }}
          RUNNER_LABEL: ${{ runner.name }}
        run: |
          $ErrorActionPreference = 'Stop'
          . "$env:GITHUB_WORKSPACE\.teamcity-trigger\.github\scripts\queue-teamcity-build.ps1"

  gate:
    name: TeamCity unit tests trigger
    needs: [attempt-1, attempt-2, attempt-3]
    runs-on: ubuntu-latest
    if: >-
      always() && (github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Require that one attempt queued the build
        shell: bash
        env:
          QUEUED_1: ${{ needs.attempt-1.outputs.queued }}
          QUEUED_2: ${{ needs.attempt-2.outputs.queued }}
          QUEUED_3: ${{ needs.attempt-3.outputs.queued }}
          RUNNER_1: ${{ needs.attempt-1.outputs.runner }}
          RUNNER_2: ${{ needs.attempt-2.outputs.runner }}
          RUNNER_3: ${{ needs.attempt-3.outputs.runner }}
          RESULT_1: ${{ needs.attempt-1.result }}
          RESULT_2: ${{ needs.attempt-2.result }}
          RESULT_3: ${{ needs.attempt-3.result }}
        run: |
          set -euo pipefail
          echo "attempt-1: result=$RESULT_1 queued=${QUEUED_1:-unset} runner=${RUNNER_1:-unknown}"
          echo "attempt-2: result=$RESULT_2 queued=${QUEUED_2:-unset} runner=${RUNNER_2:-unknown}"
          echo "attempt-3: result=$RESULT_3 queued=${QUEUED_3:-unset} runner=${RUNNER_3:-unknown}"
          if [ "${QUEUED_1:-}" = "true" ] || [ "${QUEUED_2:-}" = "true" ] || [ "${QUEUED_3:-}" = "true" ]; then
            echo "A TeamCity unit-tests build is queued. Its result is published onto the PR head commit"
            echo "by TeamCity's Commit Status Publisher, as a separate commit status."
            exit 0
          fi
          echo "::error::No attempt could reach TeamCity, so no unit-tests build was queued."
          echo "Runners tried: ${RUNNER_1:-unknown}, ${RUNNER_2:-unknown}, ${RUNNER_3:-unknown}."
          echo "This is a runner/network problem, not a problem with the pull request:"
          echo "teamcity-rnd.bpmonline.com only resolves to the TeamCity server from inside the"
          echo "corporate network. Label the in-network runners and pin runs-on to that label"
          echo "(see the comment at the top of this workflow), or bring an in-network runner online."
          exit 1
