---
# ENG-92669 - surface the TeamCity MCP e2e result on clio PRs.
#
# TeamCity is internal (teamcity-rnd.bpmonline.com) and clio lives on public
# github.com, so we cannot rely on TeamCity's native "Pull Requests" auto-
# discovery: the Team_Atf_ClioMcpE2eTests config checks out its branch from the
# `BranchNameClio` parameter (root branch = refs/heads/%BranchNameClio%), not via
# TeamCity branch-tracking. Instead, this workflow - running on the self-hosted
# runner that already lives inside the corporate network - triggers the TeamCity
# build for the PR head branch. TeamCity's Commit Status Publisher (GitHub App
# "TeamCity ATF") then posts pending/success/failure back onto the PR head SHA as
# a commit status, so the result shows in the PR checks list.
#
# Phase 1 is advisory (non-blocking) - the status is informational and is NOT a
# required check. The unit-tests config (Team_Atf_ClioUnitTests) uses a different
# branch model and is handled as a fast-follow, not here.
#
# Prerequisites (one-time, outside this repo) - all in place at merge time:
#   1. TeamCity: Commit Status Publisher on Team_Atf_ClioMcpE2eTests (GitHub App
#      connection "TeamCity ATF") - DONE; validated against PR #651.
#   2. GitHub repo secret TEAMCITY_TOKEN - a scoped TeamCity token with exactly:
#      Run build + View project + Comment build (build comment) + Reorder builds
#      in queue (moveToTop). Nothing more (a same-repo PR can edit this workflow).
#      Prefer minting it as a dedicated technical user so builds are attributed to
#      a CI account rather than a person.
#   3. Repo setting Actions -> "Require approval for all external contributors"
#      (authoritative fork control; the in-file `if:` guard below is only
#      defense-in-depth). To be confirmed by a repo admin.
#
# Note (advisory accuracy): only BranchNameClio (a branch name) is passed, so
# TeamCity resolves the branch tip at build time. If a newer commit lands while a
# build is queued, the status can post to the tip rather than the exact commit
# that triggered this run. Acceptable for an advisory check.
#
# ENG-94529 - WHY THERE ARE TWO PARALLEL ATTEMPT JOBS.
# `runs-on: self-hosted` matches EVERY runner in the Default group, and not all of
# them sit inside the corporate network. On a runner without corporate DNS,
# teamcity-rnd.bpmonline.com resolves through public DNS to the bpmonline.com web
# tier (a CNAME chain ending at 52.31.26.85), whose nginx answers /app/rest/... with
# a bare `404 Not Found`. Roughly a third of the runs died that way - always on the
# same runner - and the failure read as a broken PR check rather than a broken
# runner. Two things follow, both implemented below:
#   * The token is NEVER sent before the target is proven to be TeamCity. The old
#     single POST sent `Authorization: Bearer <TEAMCITY_TOKEN>` to whatever that
#     hostname resolved to; on the out-of-network runner the corporate CI token went
#     to a public web front end. The preflight is unauthenticated and requires the
#     `TeamCity-Node-Id` response header, which only the real server sets.
#   * Two attempt jobs run IN PARALLEL. A self-hosted runner executes one job at a
#     time, so as long as two runners are idle the two jobs land on two different
#     ones and an in-network runner is reached even when another runner takes the
#     first job. Whichever attempt has no route exits green and defers; the gate job
#     fails only when NO attempt could queue, and its message names the runners that
#     were tried. This raises the odds rather than guaranteeing the outcome: if only
#     the out-of-network runner is idle, both jobs land on it and the gate reports
#     exactly that.
# THE PROPER FIX IS ONE LINE AND NEEDS A RUNNER ADMIN: label the in-network runners
# (e.g. `teamcity-net`) and replace `runs-on: self-hosted` with
# `runs-on: [self-hosted, teamcity-net]`. Once that label exists, delete the second
# attempt job and the gate - keep the preflight, which is a credential-safety
# control and not a workaround.
name: TeamCity MCP e2e

# GITHUB_TOKEN is unused here; drop all scopes so an in-network runner never
# carries ambient repo write via org defaults.
permissions: {}

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]
    # Trigger on clio source changes, but NOT docs-only PRs - command docs live
    # under clio/ (clio/docs, clio/help, clio/Commands.md) and would otherwise
    # queue the ~45-min full-Creatio build for nothing.
    paths:
      - 'clio/**'
      - '!clio/docs/**'
      - '!clio/help/**'
      - '!clio/Commands.md'
      - 'clio.mcp.e2e/**'
      - 'cliogate/**'
      - 'Directory.Packages.props'
  # Manual retrigger for a specific clio branch (e.g. re-run e2e after a flaky
  # failure, or validate the trigger). Only usable once the workflow is on the
  # default branch - a GitHub constraint.
  workflow_dispatch:
    inputs:
      branch:
        description: 'clio branch to run MCP e2e on'
        required: true
        default: master

# De-dupes rapid GitHub trigger runs per PR (the sub-second POST job only).
# NOTE: this does NOT stop the ~45-min TeamCity build a prior run already queued
# - the least-privilege token cannot cancel builds. Concurrent full-Creatio
# deploys are bounded on the TeamCity side (build config: max simultaneous
# builds), which is where superseded/parallel runs are actually serialized.
# Manual runs key off run_id so they don't cancel each other.
concurrency:
  group: teamcity-mcp-e2e-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  attempt-1:
    name: Queue TeamCity MCP e2e (attempt 1)
    runs-on: self-hosted
    # Never pin a shared self-hosted runner if TeamCity is unreachable/stalled.
    timeout-minutes: 10
    # SECURITY: this job runs on an in-network self-hosted runner. On a public
    # repo, a fork PR still fires `pull_request` and would run the fork-controlled
    # workflow body on that runner (a network-pivot surface) - so restrict to
    # same-repo PRs and manual dispatch. This in-file guard is defense-in-depth;
    # the authoritative control is the repo setting Actions -> "Require approval
    # for all external contributors" (must be enabled).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      # Only the workflow's own scripts are needed; checkout must not leave a token
      # behind on an in-network runner.
      contents: read
    outputs:
      queued: ${{ steps.queue.outputs.queued }}
      runner: ${{ steps.queue.outputs.runner }}
    steps:
      # Only .github/scripts, and no credential left in the local git config: the
      # trigger script is shared by both attempts and lives in the repository so
      # there is exactly one copy of it.
      - name: Check out the trigger script
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
      - name: Queue TeamCity build for the PR branch
        id: queue
        shell: powershell
        env:
          TC_URL: https://teamcity-rnd.bpmonline.com
          TC_TOKEN: ${{ secrets.TEAMCITY_TOKEN }}
          BUILD_TYPE: Team_Atf_ClioMcpE2eTests
          # pull_request -> PR head branch; workflow_dispatch -> the chosen branch.
          HEAD_REF: ${{ github.event.pull_request.head.ref || inputs.branch }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '(manual)' }}
          # Attempt 1 goes first; the sibling attempt waits, so a healthy attempt 1
          # has already queued by the time the sibling looks at the queue.
          START_DELAY_SECONDS: '0'
          RUNNER_LABEL: ${{ runner.name }}
        run: |
          $ErrorActionPreference = 'Stop'
          . "$env:GITHUB_WORKSPACE\.github\scripts\queue-teamcity-build.ps1"

  attempt-2:
    name: Queue TeamCity MCP e2e (attempt 2)
    runs-on: self-hosted
    timeout-minutes: 10
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      # Only the workflow's own scripts are needed; checkout must not leave a token
      # behind on an in-network runner.
      contents: read
    outputs:
      queued: ${{ steps.queue.outputs.queued }}
      runner: ${{ steps.queue.outputs.runner }}
    steps:
      # Only .github/scripts, and no credential left in the local git config: the
      # trigger script is shared by both attempts and lives in the repository so
      # there is exactly one copy of it.
      - name: Check out the trigger script
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
      - name: Queue TeamCity build for the PR branch
        id: queue
        shell: powershell
        env:
          TC_URL: https://teamcity-rnd.bpmonline.com
          TC_TOKEN: ${{ secrets.TEAMCITY_TOKEN }}
          BUILD_TYPE: Team_Atf_ClioMcpE2eTests
          HEAD_REF: ${{ github.event.pull_request.head.ref || inputs.branch }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '(manual)' }}
          # Deliberate lag: this attempt exists only to cover the case where the
          # other one landed on a runner with no route to TeamCity. Waiting first
          # means that when BOTH runners are healthy this one finds the build
          # already queued and does not queue a second full-Creatio build.
          START_DELAY_SECONDS: '25'
          RUNNER_LABEL: ${{ runner.name }}
        run: |
          $ErrorActionPreference = 'Stop'
          . "$env:GITHUB_WORKSPACE\.github\scripts\queue-teamcity-build.ps1"

  gate:
    name: TeamCity MCP e2e trigger
    needs: [attempt-1, attempt-2]
    runs-on: ubuntu-latest
    if: >-
      always() && (github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Require that one attempt queued the build
        shell: bash
        env:
          QUEUED_1: ${{ needs.attempt-1.outputs.queued }}
          QUEUED_2: ${{ needs.attempt-2.outputs.queued }}
          RUNNER_1: ${{ needs.attempt-1.outputs.runner }}
          RUNNER_2: ${{ needs.attempt-2.outputs.runner }}
          RESULT_1: ${{ needs.attempt-1.result }}
          RESULT_2: ${{ needs.attempt-2.result }}
        run: |
          set -euo pipefail
          echo "attempt-1: result=$RESULT_1 queued=${QUEUED_1:-unset} runner=${RUNNER_1:-unknown}"
          echo "attempt-2: result=$RESULT_2 queued=${QUEUED_2:-unset} runner=${RUNNER_2:-unknown}"
          if [ "${QUEUED_1:-}" = "true" ] || [ "${QUEUED_2:-}" = "true" ]; then
            echo "A TeamCity MCP e2e build is queued. Its result is published onto the PR head commit"
            echo "by TeamCity's Commit Status Publisher, as a separate commit status."
            exit 0
          fi
          echo "::error::No attempt could reach TeamCity, so no MCP e2e build was queued."
          echo "Runners tried: ${RUNNER_1:-unknown}, ${RUNNER_2:-unknown}."
          echo "This is a runner/network problem, not a problem with the pull request:"
          echo "teamcity-rnd.bpmonline.com only resolves to the TeamCity server from inside the"
          echo "corporate network. Label the in-network runners and pin runs-on to that label"
          echo "(see the comment at the top of this workflow), or bring an in-network runner online."
          exit 1
