---
# ENG-94529: these jobs run on GITHUB-HOSTED runners on purpose.
# They only need a .NET SDK and the repository, so nothing here justifies borrowing a
# machine from the shared self-hosted pool - a pool that also contains laptops. Two
# concrete failures came from that pool: a runner without corporate DNS turned the
# TeamCity trigger red for three days, and a sparse checkout by another workflow left
# the SHARED per-repository working directory without clio.tests, which failed the
# unit-test job with MSB1009 on that runner only. A hosted runner is a clean machine
# per job, and for a public repository it costs nothing.
# The SDK is pinned rather than inherited from the image. The main unit and integration
# suites intentionally run only on net10.0; product multi-targeting is validated elsewhere.
name: Build
on:
  push:
    branches:
      - master
      - test
  pull_request:
    types: [opened, synchronize, reopened]

jobs:

  # ── Detect which areas of the codebase changed ────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      clio-src:    ${{ steps.filter.outputs.clio-src }}
      tests:       ${{ steps.filter.outputs.tests }}
      analyzers:   ${{ steps.filter.outputs.analyzers }}
      cliogate:    ${{ steps.filter.outputs.cliogate }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history needed for accurate path diffing
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            clio-src:
              - 'clio/**'
              - 'Creatio.ConflictResolver/**'
              - 'Directory.Packages.props'
            tests:
              - '.github/workflows/build.yml'
              - '.github/scripts/*TestShard*.ps1'
              - 'clio.tests/**'
              - 'Creatio.ConflictResolver.Tests/**'
              - 'clio.mcp.e2e/**'
              - 'clio.process.fixture/**'
            analyzers:
              - 'Clio.Analyzers/**'
              - 'Clio.Analyzers.Tests/**'
              - 'Directory.Packages.props'
            cliogate:
              - 'cliogate/**'
              - 'cliogate.tests/**'

  # TEST_SHARDING_DISABLED=true collapses each suite to one matrix row that uses
  # the exact pre-sharding predicate. The required check names stay unchanged.
  test-shard-plan:
    name: Plan test shards
    needs: changes
    runs-on: ubuntu-latest
    outputs:
      unit-matrix: ${{ steps.plan.outputs.unit-matrix }}
      integration-matrix: ${{ steps.plan.outputs.integration-matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Build matrices
        id: plan
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $disabled = '${{ vars.TEST_SHARDING_DISABLED }}' -eq 'true'
          $arguments = if ($disabled) { @{ DisableSharding = $true } } else { @{} }
          $unit = & ./.github/scripts/Get-TestShardMatrix.ps1 -Suite unit @arguments
          $integration = & ./.github/scripts/Get-TestShardMatrix.ps1 -Suite integration @arguments
          "unit-matrix=$unit" >> $env:GITHUB_OUTPUT
          "integration-matrix=$integration" >> $env:GITHUB_OUTPUT

  test-assembly:
    name: Build test assembly
    needs: changes
    if: >-
      needs.changes.outputs.clio-src == 'true' ||
      needs.changes.outputs.tests   == 'true' ||
      github.ref == 'refs/heads/master'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build once for all seven test runners
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:GITHUB_WORKSPACE
          dotnet build .\clio.tests\clio.tests.csproj `
            --configuration Release `
            --framework net10.0 `
            -p:RunAnalyzers=false

      - name: Upload compiled test assembly
        uses: actions/upload-artifact@v4
        with:
          name: clio-tests-net10
          path: clio.tests/bin/Release/net10.0
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  net8-compatibility:
    name: NET8 Product Compatibility
    needs: changes
    if: >-
      needs.changes.outputs.clio-src == 'true' ||
      needs.changes.outputs.tests   == 'true' ||
      github.ref == 'refs/heads/master'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build NET8 product compatibility
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:GITHUB_WORKSPACE
          dotnet build .\clio\clio.csproj `
            --framework net8.0 `
            -p:RunAnalyzers=false

  # ── Unit tests (four hosted runners; fast gate runs on every push) ────
  unit-test-shards:
    name: Unit Test Shard (${{ matrix.name }})
    needs: [changes, test-shard-plan, test-assembly]
    if: >-
      needs.changes.outputs.clio-src == 'true' ||
      needs.changes.outputs.tests   == 'true' ||
      github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test-shard-plan.outputs.unit-matrix) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v5
        with:
          name: clio-tests-net10
          path: clio.tests/bin/Release/net10.0

      # Anchor the working directory: `shell: powershell` loads the user profile (there is no -NoProfile) and
      # every project path in these steps is relative, so the step should not depend on the cwd it inherits.
      # Hygiene only — the MSB1009 incident this looks like a fix for is diagnosed in the step body below, and
      # its cause is on the runner host.

      - name: Run unit test shard
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop';
          Set-Location $env:GITHUB_WORKSPACE;
          # Why the Set-Location above, and what it is NOT for. Two self-hosted runners spent a day failing
          # this job in ~1s with `MSB1009: Project file does not exist` while actions/checkout reported
          # success. Anchoring the cwd did not help, and an on-runner diagnostic (2026-08-11, TS1-CORE-DEV24,
          # install at C:/creatio/actions-runner) showed why: the workspace contained ONLY `.git`, yet
          # `git status` reported a clean tree and `git ls-files --error-unmatch clio.tests/clio.tests.csproj`
          # resolved. Git was operating on a worktree somewhere else — a stale `core.worktree` in the repo
          # config, or a machine-level GIT_WORK_TREE/GIT_DIR — so checkout "succeeded" while this directory
          # stayed empty. That is a runner-host defect: deleting `_work/clio` on the affected box (forcing a
          # fresh clone) and clearing those variables is the fix, and no workflow change can substitute for it.
          # The Set-Location stays because a relative path in a profile-loading shell should not be trusted,
          # not because it addresses the above.
          $arguments = @{
            Suite = 'unit'
            ShardName = '${{ matrix.name }}'
            ResultsDirectory = 'TestResults/${{ matrix.name }}'
          }
          if ('${{ matrix.shardingDisabled }}' -eq 'true') {
            $arguments.DisableSharding = $true
          }
          & .\.github\scripts\Invoke-TestShard.ps1 @arguments

      - name: Run ConflictResolver tests
        if: matrix.name == 'unit-1' || matrix.shardingDisabled
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:GITHUB_WORKSPACE
          dotnet test .\Creatio.ConflictResolver.Tests\Creatio.ConflictResolver.Tests.csproj `
            --configuration Release `
            -p:RunAnalyzers=false

      - name: Upload unit test timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}
          path: TestResults/${{ matrix.name }}/*.trx
          if-no-files-found: warn
          retention-days: 14

  unit-tests:
    name: Unit Tests
    needs: [changes, net8-compatibility, unit-test-shards]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Preserve the required unit-test gate
        if: >-
          (needs.changes.outputs.clio-src == 'true' ||
           needs.changes.outputs.tests   == 'true' ||
           github.ref == 'refs/heads/master') &&
          (needs.net8-compatibility.result != 'success' ||
           needs.unit-test-shards.result != 'success')
        run: exit 1

  # ── ClioGate tests (only when the bundled service changes) ──────────
  cliogate-tests:
    name: ClioGate Tests
    needs: changes
    if: >-
      needs.changes.outputs.cliogate == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    # ClioGate restores Creatio packages from the private Nexus feed, which is unreachable from hosted runners.
    runs-on: [self-hosted, Windows]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run ClioGate tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop';
          Set-Location $env:GITHUB_WORKSPACE;
          dotnet test .\cliogate.tests\cliogate.tests.csproj `
            --configuration Release;

  # ── Integration tests (three hosted runners in parallel with unit tests) ──
  integration-test-shards:
    name: Integration Test Shard (${{ matrix.name }})
    needs: [changes, test-shard-plan, test-assembly]
    if: >-
      (needs.changes.outputs.clio-src == 'true' ||
       needs.changes.outputs.tests   == 'true') &&
      github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test-shard-plan.outputs.integration-matrix) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v5
        with:
          name: clio-tests-net10
          path: clio.tests/bin/Release/net10.0

      - name: Run integration test shard
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:GITHUB_WORKSPACE
          $arguments = @{
            Suite = 'integration'
            ShardName = '${{ matrix.name }}'
            ResultsDirectory = 'TestResults/${{ matrix.name }}'
          }
          if ('${{ matrix.shardingDisabled }}' -eq 'true') {
            $arguments.DisableSharding = $true
          }
          & .\.github\scripts\Invoke-TestShard.ps1 @arguments

      - name: Upload integration test timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}
          path: TestResults/${{ matrix.name }}/*.trx
          if-no-files-found: warn
          retention-days: 14

  integration-tests:
    name: Integration Tests
    needs: [changes, integration-test-shards]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Preserve the required integration-test gate
        if: >-
          (needs.changes.outputs.clio-src == 'true' ||
           needs.changes.outputs.tests   == 'true') &&
          github.event_name == 'pull_request' &&
          needs.integration-test-shards.result != 'success'
        run: exit 1

  # ── Analyzer tests (only when analyzer code changes) ──────────────────
  analyzer-tests:
    name: Analyzer Tests
    needs: changes
    if: needs.changes.outputs.analyzers == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run analyzer tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop';
          Set-Location $env:GITHUB_WORKSPACE;
          dotnet test .\Clio.Analyzers.Tests\Clio.Analyzers.Tests.csproj `
            --framework net10.0 `
            -p:RunAnalyzers=false;

