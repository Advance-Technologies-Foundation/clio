---
# ENG-94529: these jobs run on GITHUB-HOSTED runners on purpose.
# They only need a .NET SDK and the repository, so nothing here justifies borrowing a
# machine from the shared self-hosted pool - a pool that also contains laptops. Two
# concrete failures came from that pool: a runner without corporate DNS turned the
# TeamCity trigger red for three days, and a sparse checkout by another workflow left
# the SHARED per-repository working directory without clio.tests, which failed the
# unit-test job with MSB1009 on that runner only. A hosted runner is a clean machine
# per job, and for a public repository it costs nothing.
# The SDK is pinned rather than inherited from the image. The main unit and integration
# suites intentionally run only on net10.0; product multi-targeting is validated elsewhere.
name: Build
on:
  push:
    branches:
      - master
      - test
  pull_request:
    types: [opened, synchronize, reopened]

jobs:

  # ── Detect which areas of the codebase changed ────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      clio-src:    ${{ steps.filter.outputs.clio-src }}
      tests:       ${{ steps.filter.outputs.tests }}
      analyzers:   ${{ steps.filter.outputs.analyzers }}
      cliogate:    ${{ steps.filter.outputs.cliogate }}
      scripts:     ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history needed for accurate path diffing
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            clio-src:
              - 'clio/**'
              - 'Directory.Packages.props'
            tests:
              - 'clio.tests/**'
              - 'clio.mcp.e2e/**'
              - 'clio.process.fixture/**'
            analyzers:
              - 'Clio.Analyzers/**'
              - 'Clio.Analyzers.Tests/**'
              - 'Directory.Packages.props'
            cliogate:
              - 'cliogate/**'
              - 'cliogate.tests/**'
            scripts:
              - 'scripts/**'
              - '.gitattributes'

  # ── Repository scripts (issue-claim protocol) ─────────────────────────
  # These scripts are the arbitration between the parallel agents that work on this
  # repository, so their behaviour needs a gate of its own: nothing else in this workflow
  # executes them. The harness replaces `gh` with a fake and uses a real local bare
  # repository as `origin`, so the compare-and-swap that decides the claim is exercised for
  # real. It runs against both implementations, and the Windows leg checks the thing that
  # actually broke once: a CRLF checkout that `bash -n` cannot parse.
  script-tests:
    name: Script Tests
    needs: changes
    if: >-
      needs.changes.outputs.scripts == 'true' ||
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Claim protocol - bash implementation
        shell: bash
        run: ./scripts/tests/claim-issue.tests.sh sh

      - name: Claim protocol - PowerShell implementation
        shell: bash
        run: ./scripts/tests/claim-issue.tests.sh ps1

  script-checkout-windows:
    name: Script Checkout (Windows)
    needs: changes
    if: >-
      needs.changes.outputs.scripts == 'true' ||
      github.ref == 'refs/heads/master'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # The file as materialized on a Windows checkout, not the blob in git: a CRLF working-tree
      # copy makes `bash -n` exit 2 on an otherwise valid script.
      - name: Shell entrypoints parse as checked out
        shell: bash
        run: |
          set -euo pipefail
          status=0
          # fake-gh is listed explicitly: it is executable and has a shebang but no .sh suffix, so a
          # glob-only scan misses it — and a CRLF copy of it fails as `/usr/bin/env: bash\r`.
          for f in scripts/*.sh scripts/tests/*.sh scripts/tests/fake-gh; do
            if grep -q $'\r' "$f"; then
              echo "::error file=$f::checked out with CRLF - .gitattributes must pin it to LF"
              status=1
            fi
            bash -n "$f" || { echo "::error file=$f::bash -n failed on the checked-out file"; status=1; }
          done
          exit "$status"

      # The behaviour harness on Windows too, not only the parser check: the claim protocol runs on
      # developer Windows machines, and git-bash is where the CRLF and path-shape differences bite.
      - name: Claim protocol - bash implementation
        shell: bash
        run: ./scripts/tests/claim-issue.tests.sh sh

      - name: Claim protocol - PowerShell implementation
        shell: bash
        run: ./scripts/tests/claim-issue.tests.sh ps1

      - name: PowerShell entrypoints parse
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -Path scripts -Filter *.ps1 -Recurse | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              $errors | ForEach-Object { Write-Host "::error file=$($_.Extent.File)::$($_.Message)" }
              throw "Parse errors in $($_.FullName)"
            }
          }

  # ── Unit tests (fast gate — runs on every push) ───────────────────────
  unit-tests:
    name: Unit Tests
    needs: changes
    if: >-
      needs.changes.outputs.clio-src == 'true' ||
      needs.changes.outputs.tests   == 'true' ||
      github.ref == 'refs/heads/master'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build NET8 product compatibility
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop';
          Set-Location $env:GITHUB_WORKSPACE;
          dotnet build .\clio\clio.csproj `
            --framework net8.0 `
            -p:RunAnalyzers=false;

      # Anchor the working directory: `shell: powershell` loads the user profile (there is no -NoProfile) and
      # every project path in these steps is relative, so the step should not depend on the cwd it inherits.
      # Hygiene only — the MSB1009 incident this looks like a fix for is diagnosed in the step body below, and
      # its cause is on the runner host.

      - name: Run unit tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop';
          Set-Location $env:GITHUB_WORKSPACE;
          # Why the Set-Location above, and what it is NOT for. Two self-hosted runners spent a day failing
          # this job in ~1s with `MSB1009: Project file does not exist` while actions/checkout reported
          # success. Anchoring the cwd did not help, and an on-runner diagnostic (2026-08-11, TS1-CORE-DEV24,
          # install at C:/creatio/actions-runner) showed why: the workspace contained ONLY `.git`, yet
          # `git status` reported a clean tree and `git ls-files --error-unmatch clio.tests/clio.tests.csproj`
          # resolved. Git was operating on a worktree somewhere else — a stale `core.worktree` in the repo
          # config, or a machine-level GIT_WORK_TREE/GIT_DIR — so checkout "succeeded" while this directory
          # stayed empty. That is a runner-host defect: deleting `_work/clio` on the affected box (forcing a
          # fresh clone) and clearing those variables is the fix, and no workflow change can substitute for it.
          # The Set-Location stays because a relative path in a profile-loading shell should not be trusted,
          # not because it addresses the above.
          dotnet build-server shutdown;
          dotnet test .\clio.tests\clio.tests.csproj `
            --framework net10.0 `
            --filter "Category!=Integration" `
            -p:RunAnalyzers=false;

  # ── Integration tests (run on PRs and master, after unit tests pass) ──
  integration-tests:
    name: Integration Tests
    needs: [changes, unit-tests]
    if: >-
      (needs.changes.outputs.clio-src == 'true' ||
       needs.changes.outputs.tests   == 'true') &&
      github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run integration tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop';
          Set-Location $env:GITHUB_WORKSPACE;
          dotnet test .\clio.tests\clio.tests.csproj `
            --framework net10.0 `
            --filter "Category=Integration" `
            -p:RunAnalyzers=false;

  # ── Analyzer tests (only when analyzer code changes) ──────────────────
  analyzer-tests:
    name: Analyzer Tests
    needs: changes
    if: needs.changes.outputs.analyzers == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run analyzer tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop';
          Set-Location $env:GITHUB_WORKSPACE;
          dotnet test .\Clio.Analyzers.Tests\Clio.Analyzers.Tests.csproj `
            --framework net10.0 `
            -p:RunAnalyzers=false;

